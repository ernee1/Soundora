name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: |
          ls
          mkdir proj
          for f in *.zip; do unzip -q -o "$f" -d proj; done
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "Proje klasoru: $D"
          echo "PROJ=$D" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Derle
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
      - name: Hatalari goster
        if: failure()
        working-directory: ${{ env.PROJ }}
        run: grep -E "^e: |What went wrong|error:|Execution failed" -A4 build.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: Soundora-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
